<div class="job-container">
    <h1>Hacker News Jobs Board</h1>

<div *ngFor="let id of jobIdDisplayList">

</div>

<button (click) ="loadMoreJobs()">Load more jobs</button>
<a routerLink="/interested-job-board" routerLinkActive="active">View Interested Jobs</a>
</div>
